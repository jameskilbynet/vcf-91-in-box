vmaccepteula
# 64GB SATADOM (ESX boot device). The %pre script below finds it by name at
# install time rather than hard-coding the device ID (a hard-coded ID failed
# on ntnx-3 with "unable to find a disk"). --ignoreprereqwarnings is
# needed for the Haswell-EP CPU (allowLegacyCPU=true) and the <128GB boot device.
%include /tmp/installdisk
reboot

network --bootproto=static --device=vmnic2 --vlanid=100 --ip=192.168.100.12 --netmask=255.255.255.0 --gateway=192.168.100.1 --hostname=uk-bhr-p-ntnx-2.jameskilby.cloud --nameserver=192.168.10.250,192.168.10.251 --addvmportgroup=1
rootpw VMware123!

%pre --interpreter=busybox
# Pick the SATADOM; never fall back to another disk (that would wipe a vSAN SSD).
DISK=$(ls /vmfs/devices/disks/ | grep -E '^t10\.ATA_+SATADOM' | grep -v ':' | head -1)
if [ -n "$DISK" ]; then
    echo "install --disk=$DISK --overwritevmfs --ignoreprereqwarnings" > /tmp/installdisk
else
    echo "install --disk=NO_SATADOM_FOUND_check_ls_vmfs_devices_disks" > /tmp/installdisk
fi

%firstboot --interpreter=busybox

# vSAN ESA storage pool: every local SSD (claimed by SDDC Manager)
VSAN_DISKS="naa.5002538c700033a6 naa.5002538c401a4249 naa.5002538c404454d9"
# Wipe the vSAN disks (any old VMFS) so the
# VCF Installer sees them as eligible. Set to "false" to leave them alone.
WIPE_VSAN_DISKS="true"
NTP_SERVER=192.168.100.1
SSH_ROOT_KEY=""
MANAGEMENT_VLAN=100
# vSwitch0/vmnic2 must carry jumbo for the installer's MTU 8000 vmkping
# validation; vmk0 itself stays at 1500 because the VLAN 100 gateway is 1500.
MANAGEMENT_VSWITCH_MTU=9000
MANAGEMENT_VMK_MTU=1500

# Ensure hostd is ready
while ! vim-cmd hostsvc/runtimeinfo; do
sleep 10
done

# Enter Maintenance Mode
esxcli system maintenanceMode set -e true

# enable & start SSH
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# enable & start ESXi Shell
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# Suppress ESXi Shell warning
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Configure NTP
esxcli system ntp set -e true -s $NTP_SERVER

# Prepare vSAN ESA disks
if [ "$WIPE_VSAN_DISKS" = "true" ]; then
    for d in $VSAN_DISKS; do
        for v in $(esxcli storage vmfs extent list | awk -v d="$d" '$4 == d {print $1}'); do
            esxcli storage filesystem unmount -l "$v"
        done
        partedUtil mklabel /vmfs/devices/disks/$d gpt
    done
fi

# Disable LRO/TSO (Intel X710/XXV710 i40en nics)
esxcli system settings advanced set -o /Net/TcpipDefLROEnabled -i 0
esxcli system settings advanced set -o /Net/UseHwTSO -i 0

# Use older vSAN ESA compression algorithm
esxcli system settings advanced set -o /VSAN/Vsan2ZdomCompZstd -i 0

/bin/generate-certificates

# Enable Core Dump
esxcli system coredump file set -s -e true

# Configure SSH keys if provided
if [ -n "${SSH_ROOT_KEY}" ]; then
    echo "${SSH_ROOT_KEY}" > /etc/ssh/keys-root/authorized_keys
fi

# Configure VM Network VLAN & MTU
esxcli network vswitch standard portgroup set -p "VM Network" -v ${MANAGEMENT_VLAN}
esxcli network vswitch standard set -m ${MANAGEMENT_VSWITCH_MTU} -v vSwitch0
esxcli network ip interface set -i vmk0 -m ${MANAGEMENT_VMK_MTU}

# Exit Maintenance Mode
esxcli system maintenanceMode set -e false

reboot
